name: Release

# Pushing a tag like v0.3.0 builds the binaries for all platforms and
# publishes a GitHub Release with archives and checksums (see .goreleaser.yaml).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # create the GitHub Release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs the full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test before releasing
        run: go test ./...

      # Use this version's section of CHANGELOG.md as the release notes.
      # Fails if the changelog has no entry for the tag.
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/{ p = index($0, "[" v "]") } p' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md" || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
