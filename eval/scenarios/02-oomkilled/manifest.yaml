---
# Scenario 02: OOMKilled
# The container has a 10Mi memory limit, but `dd` allocates a single 64M buffer.
# The Linux OOM killer terminates it: reason "OOMKilled", exit code 137.
# kubectl-why should detect OOMKilled and suggest increasing the memory limit.
apiVersion: v1
kind: Pod
metadata:
  name: oomkilled-pod
  labels:
    scenario: oomkilled
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: busybox:1.36
      imagePullPolicy: IfNotPresent  # allows images pre-loaded with `kind load docker-image`
      command: ["dd", "if=/dev/zero", "of=/dev/null", "bs=64M", "count=1"]
      resources:
        requests:
          memory: "10Mi"
          cpu: "50m"
        limits:
          memory: "10Mi"   # intentionally tiny – triggers OOM
          cpu: "200m"
