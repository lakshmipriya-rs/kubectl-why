---
# Scenario 05: CrashLoopBackOff
# The app logs a fatal error about a missing config file and exits with code 1.
# Kubernetes restarts it with growing back-off: CrashLoopBackOff.
# kubectl-why should report CrashLoopBackOff with the exit code and the log
# line, and must NOT report ImagePullBackOff (crash loops also emit "BackOff"
# events, which used to cause that false positive).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashy
  labels:
    app: crashy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashy
  template:
    metadata:
      labels:
        app: crashy
    spec:
      containers:
        - name: app
          image: busybox:1.36
          imagePullPolicy: IfNotPresent  # allows images pre-loaded with `kind load`
          command:
            - sh
            - -c
            - |
              echo "starting app v1.4.2"
              echo "loading configuration"
              echo "FATAL: config file /etc/app/config.yaml not found" >&2
              exit 1
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
