---
# Scenario 06: Readiness probe failing with HTTP 404
# The web server runs fine on port 8080, but the readiness probe asks for
# /healthz, which doesn't exist. The pod stays Running but never Ready, so a
# Service would send it no traffic. Nothing crashes or restarts.
# kubectl-why should report ProbeFailure (wrong path), not a crash.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent  # allows images pre-loaded with `kind load`
          command: ["httpd", "-f", "-p", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz   # this path does not exist: busybox httpd returns 404
              port: 8080
            periodSeconds: 3
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              memory: "64Mi"
